# The boot menu on the Veil OS live image.
#
# Read by the BIOS GRUB on this disk and by Ubuntu's signed CD GRUB alike;
# both load this file from /boot/grub on the disk they started from.

set timeout=10
set timeout_style=menu
set default=0

# Graphics first, so the theme can draw. If any of this fails, GRUB falls back
# to its plain text menu - which still boots.
insmod all_video
insmod gfxterm
insmod png
insmod font

# With Secure Boot on, the signed GRUB refuses font files from the disk and
# uses the one built into it, "unicode"; the BIOS GRUB finds the same font in
# /boot/grub/fonts.
if loadfont unicode; then
    # The largest common mode the firmware offers; "auto" alone settles for
    # 640x480 on many BIOS machines.
    set gfxmode=1920x1080,1600x900,1366x768,1280x800,1280x720,1024x768,auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# The automated boot test (tests/boot-test.sh) marks its virtual machines
# with an SMBIOS string. On those - and only those - GRUB and the kernel also
# write to the first serial port, so a machine that stops before the desktop
# still says why. On BIOS only: the signed UEFI GRUB is not allowed to load
# the smbios module, and the UEFI machine reports from the running system.
set veil_test_args=""
if [ "$grub_platform" = "pc" ]; then
    insmod smbios
    # Offset 4 of an OEM-strings entry is its string count, which with one
    # string is also the number of that string.
    if smbios --type 11 --get-string 4 --set veil_oem; then
        if [ "$veil_oem" = "io.systemd.credential:veil.test=1" ]; then
            insmod serial
            serial --unit=0 --speed=115200
            terminal_output --append serial
            # No login prompt on the serial port: it would hang up the report.
            set veil_test_args="console=tty0 console=ttyS0,115200 systemd.mask=serial-getty@ttyS0.service"
            echo "veil-test: GRUB is writing to the serial port"
        fi
    fi
fi

# The theme's own typeface, where GRUB is allowed to read it. Where it is not,
# the theme falls back to the font above.
if [ "$lockdown" != "y" ]; then
    loadfont /boot/grub/themes/veil/dejavu_sans_12.pf2
    loadfont /boot/grub/themes/veil/dejavu_sans_16.pf2
    loadfont /boot/grub/themes/veil/dejavu_sans_bold_16.pf2
fi
set theme=/boot/grub/themes/veil/theme.txt

set menu_color_normal=light-gray/black
set menu_color_highlight=white/black

menuentry "Try or install Veil OS @VERSION@" --class veil {
    set gfxpayload=keep
    echo "Loading the kernel"
    linux   /casper/vmlinuz boot=casper quiet splash $veil_test_args ---
    echo "Loading the initial RAM disk"
    initrd  /casper/initrd
}

# nomodeset, for the graphics cards that show a black screen otherwise -
# most often an NVIDIA card before its driver is installed.
menuentry "Veil OS with safe graphics" --class veil {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd  /casper/initrd
}

# Everything the kernel says, for when something goes wrong.
menuentry "Veil OS without the splash screen" --class veil {
    linux   /casper/vmlinuz boot=casper ---
    initrd  /casper/initrd
}

menuentry "Check this disk for errors" --class veil {
    linux   /casper/vmlinuz boot=casper integrity-check quiet splash ---
    initrd  /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware settings" --class settings {
        fwsetup
    }
fi

menuentry "Boot from the next device" --class next {
    exit 1
}
