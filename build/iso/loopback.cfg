# For booting this ISO from another GRUB's loopback menu, as tools like Ventoy
# and a hand-written grub entry do. iso_path is set by whoever loops it back.
menuentry "Try or install Veil OS" {
    linux   /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} quiet splash ---
    initrd  /casper/initrd
}
menuentry "Veil OS with safe graphics" {
    linux   /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} nomodeset quiet splash ---
    initrd  /casper/initrd
}
