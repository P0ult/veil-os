# The last thing the installer does, inside the new system.
#
# Graphics drivers are chosen on the first boot of the installed system rather
# than here: the right NVIDIA driver depends on the card, and on whether there
# is a network to fetch it from, and the installer is the wrong moment to find
# out that there is not. veil-firstboot handles both.
#
# The rest removes what only the live session needed: the installer's own
# launchers, which would otherwise offer to install Veil OS on every login.
---
dontChroot: false
timeout: 300
script:
    - command: "systemctl enable veil-firstboot.service"
      timeout: 30
    - command: "rm -f /etc/xdg/autostart/veil-installer.desktop /usr/share/applications/veil-installer.desktop /usr/bin/veil-installer /usr/bin/calamares-logs-helper"
      timeout: 10
    # The GRUB package this machine's firmware needs, from the copies in the
    # image, now that the live-only packages that depend on grub-pc are gone.
    # It also records the disk grub-pc's updates should reinstall to.
    - command: "-/usr/lib/veil/veil-install-bootloader auto"
      timeout: 600
    - command: "mkdir -p /var/lib/veil"
      timeout: 10
    - command: "touch /var/lib/veil/installed"
      timeout: 10
