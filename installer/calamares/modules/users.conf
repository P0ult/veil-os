# The groups a desktop user needs, as Ubuntu gives them - plus the ones
# gaming and Windows programs want: input devices for controllers, render and
# video for the GPU.
---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo
    - name: input
      must_exist: false
      system: true
    - name: render
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: sambashare
      must_exist: false
      system: true
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root ]
allowActiveDirectory: false
