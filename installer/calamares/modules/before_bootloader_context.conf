# Run inside the new system just before the boot loader is installed.
#
# Ubuntu's version of this step adds the ISO as an apt source and installs
# GRUB's packages from the pool on it. Veil's ISO has no pool - the packages
# are carried inside the system image instead - so this installs the GRUB
# package for this machine's firmware from those copies, and works offline.
# See system/usr/lib/veil/veil-install-bootloader.
---
dontChroot: false
timeout: 600
firmwareType:
    efi:
    - command: "/usr/lib/veil/veil-install-bootloader efi"
      timeout: 600
    bios:
    - command: "/usr/lib/veil/veil-install-bootloader bios"
      timeout: 600
