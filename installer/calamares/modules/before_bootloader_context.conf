# Run inside the new system just before the boot loader is installed.
#
# Nothing to do here, and that is the point: Ubuntu's version of this step
# adds the ISO as an apt source and installs GRUB's packages from the pool on
# it, which Veil's ISO does not have. GRUB is installed from the image's own
# copies at the end of the installation instead, once the live-only packages
# that depend on grub-pc are gone - see shellprocess_veil_finish.conf and
# system/usr/lib/veil/veil-install-bootloader.
---
dontChroot: true
timeout: 30
firmwareType:
    "*":
    - "-/bin/true"
