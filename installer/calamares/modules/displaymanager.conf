# GNOME, under GDM. The plain GNOME session: Veil's look comes from the system
# dconf database, which every GNOME session reads, so there is no session file
# of Veil's own to name here.
displaymanagers:
  - gdm
defaultDesktopEnvironment:
    executable: "gnome-session"
    desktopFile: "gnome"
basicSetup: false
sysconfigSetup: false
