# The boot loader, as Ubuntu's flavours install it, under Veil's name.
#
# The EFI directory and boot entry are "veil" - the name GRUB's own package
# updates use later, since /etc/default/grub takes it from lsb_release -
# rather than Ubuntu's, so the installer and those updates look after one
# boot entry instead of two. Ubuntu's signed GRUB reads its configuration from
# the directory it was started from, whatever that is called.
---
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
efiBootloaderId: "veil"
