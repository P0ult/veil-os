# What the live session needed and the installed system does not.
update_db: true
backend: apt
operations:
  - remove:
      - "^live-*"
      - calamares-settings-ubuntu-common
      - calamares
      - veil-installer
      - casper
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE
