# What the live session needed and the installed system does not.
#
# try_remove, not remove: a name that matches nothing - a live-* package this
# image never had - would otherwise fail the whole installation at its end.
# The installer's own launcher is not a package; the finishing step deletes it.
---
update_db: true
backend: apt
operations:
  - try_remove:
      - "^live-*"
      - calamares-settings-ubuntu-common
      - calamares
      - casper
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE
