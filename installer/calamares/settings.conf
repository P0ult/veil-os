# Veil OS installer.
#
# Modelled on Lubuntu 24.04's, which is a known-good Calamares setup for a
# casper live image on this exact base. The Ubuntu-specific module configs -
# bootloader, mount, fstab, grubcfg and the rest - come from the
# calamares-settings-ubuntu-common package unchanged; what lives here is the
# sequence, the flavour-level modules, and the branding.
---
modules-search: [ local ]

instances:
- id: before_bootloader_mkdirs
  module: contextualprocess
  config: before_bootloader_mkdirs_context.conf
- id: before_bootloader
  module: contextualprocess
  config: before_bootloader_context.conf
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf
- id: bug-LP#1829805
  module: shellprocess
  config: shellprocess_bug-LP#1829805.conf
- id: add386arch
  module: shellprocess
  config: shellprocess_add386arch.conf
- id: fixconkeys_part1
  module: shellprocess
  config: shellprocess_fixconkeys_part1.conf
- id: fixconkeys_part2
  module: shellprocess
  config: shellprocess_fixconkeys_part2.conf
# Veil's own last step: first-boot driver setup, and the live-session leftovers.
- id: veil_finish
  module: shellprocess
  config: shellprocess_veil_finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - contextualprocess@before_bootloader_mkdirs
  - shellprocess@bug-LP#1829805
  - initramfscfg
  - initramfs
  - grubcfg
  - contextualprocess@before_bootloader
  - bootloader
  # Wine and Steam need 32-bit libraries; the live image already has the
  # architecture enabled, and this keeps it that way on the installed system.
  - shellprocess@add386arch
  - shellprocess@fixconkeys_part1
  - shellprocess@fixconkeys_part2
  - packages
  - shellprocess@veil_finish
  - shellprocess@logs
  - umount
- show:
  - finished

branding: veil
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
