# Builds the Veil OS ISO, boots it, and - for a tag - publishes it.
#
#   push to main, or a pull request   checks, build, boot test
#   push a tag like os-v1.0           the same, then a draft release with the ISO
#   Actions > Build Veil OS > Run     the same as a push, by hand
#
# GitHub limits a release file to 2 GiB and the ISO is larger, so a release
# carries it in parts with a script to join them. The boot test's screenshots
# and serial logs are kept as a build artifact either way.
name: Build Veil OS

on:
  push:
    branches: [main]
    tags: ['os-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      browser_deb_url:
        description: A Veil Browser .deb to use instead of the latest published release
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every package exists in Ubuntu 24.04
        run: python3 tests/check-packages.py

      - name: Every Store entry exists on Flathub or in Ubuntu
        run: python3 tests/check-catalog.py

      - name: Scripts parse
        run: |
          set -e
          for f in build/build.sh build/config.sh build/chroot/*.sh tests/boot-test.sh \
                   apps/veil-center/build-deb.sh apps/veil-center/helper/veil-store-helper \
                   system/usr/bin/veil-run-windows system/usr/lib/veil/*; do
            bash -n "$f"
          done
          sh -n apps/veil-center/packaging/postinst
          sh -n apps/veil-center/packaging/postrm
          shellcheck -S error build/build.sh build/chroot/*.sh tests/boot-test.sh \
            apps/veil-center/build-deb.sh apps/veil-center/helper/veil-store-helper \
            system/usr/bin/veil-run-windows system/usr/lib/veil/*

      - name: Desktop defaults compile
        run: |
          set -e
          sudo apt-get install -y -qq dconf-cli
          mkdir -p /tmp/dconf/local.d
          sed -e "s|@FAVORITES@|['veil.desktop']|" -e "s|@PINNED@|[{'id': 'veil.desktop'}]|" \
            desktop/dconf/00-veil > /tmp/dconf/local.d/00-veil
          python3 desktop/generate-dconf.py /tmp/dconf/local.d/10-layout
          dconf compile /tmp/dconf/out /tmp/dconf/local.d

      - name: Veil Center tests
        working-directory: apps/veil-center
        run: node test/run.js

  iso:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VEIL_BROWSER_DEB_URL: ${{ github.event.inputs.browser_deb_url }}
    steps:
      # The runner's own disk is too small for a chroot, a squashfs and an
      # ISO side by side; /mnt has room, and some preinstalled toolchains can go.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          sudo mkdir -p /mnt/veil && sudo chown "$USER" /mnt/veil
          df -h / /mnt

      - uses: actions/checkout@v4

      # A commit whose message contains [boot-only RUN_ID] skips the build and
      # boots the ISO that run built, for working on the boot test - or on
      # what a release does with the image - without waiting half an hour for
      # an image that has not changed. It has to be asked for by name, and
      # the run it names built the same commit.
      - name: Reuse an earlier ISO?
        id: reuse
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run="$(printf '%s\n' "$MESSAGE" | grep -o '\[boot-only [0-9]*\]' | grep -o '[0-9][0-9]*' || true)"
          run="${run%%$'\n'*}"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # [tests: install] boots only the machines named; all of them otherwise.
          tests="$(printf '%s\n' "$MESSAGE" | grep -o '\[tests: [a-z -]*\]' | sed 's/^\[tests: //; s/\]$//' || true)"
          echo "tests=${tests%%$'\n'*}" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then echo "Booting the ISO built by run $run"; else echo "Building a new ISO"; fi

      - uses: actions/setup-node@v4
        if: steps.reuse.outputs.run == ''
        with:
          node-version: 22

      - name: Build tools
        if: steps.reuse.outputs.run == ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil dpkg-dev

      - name: Veil Store and Veil Appearance
        if: steps.reuse.outputs.run == ''
        run: apps/veil-center/build-deb.sh

      - name: Build the ISO
        if: steps.reuse.outputs.run == ''
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_TOKEN,VEIL_BROWSER_DEB_URL \
            WORK=/mnt/veil/work OUT="$PWD/out" \
            build/build.sh 2>&1 | tee build.log
          # The build runs as root; the steps after it do not.
          sudo chown -R "$(id -u):$(id -g)" out
          ls -la out

      - name: Keep the ISO for boot-only runs
        if: steps.reuse.outputs.run == '' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/*.iso
          compression-level: 0
          retention-days: 3

      - name: Fetch the earlier ISO
        if: steps.reuse.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
          run-id: ${{ steps.reuse.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot tools
        shell: bash
        run: |
          {
            set -x
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf python3-pil
            ls /usr/share/OVMF/
            # Let the runner's user open /dev/kvm, where the runner has one.
            if [ -e /dev/kvm ]; then
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules || true
              sudo udevadm trigger --name-match=kvm || true
              sudo chmod 666 /dev/kvm || true
              ls -l /dev/kvm
            else
              echo "This runner has no /dev/kvm; the boot test will be slow."
            fi
          } 2>&1 | tee boot-tools.log

      - name: Boot test
        id: boot
        shell: bash
        timeout-minutes: 180
        env:
          VEIL_TESTS: ${{ steps.reuse.outputs.tests }}
        run: tests/boot-test.sh out/*.iso out/boot-test 2>&1 | tee boot-test.log

      - name: Summary
        if: always()
        run: |
          [ -f out/boot-test/summary.md ] && cat out/boot-test/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Split the ISO for the release
        if: startsWith(github.ref, 'refs/tags/os-v')
        shell: bash
        run: |
          set -e
          cd out
          iso="$(ls *.iso)"
          mkdir -p release
          # Pieces well under GitHub's two-gigabyte limit for one file: a
          # nearly-full upload is the part that fails.
          split -b 900M -d -a 2 "$iso" "release/$iso.part"
          sha256sum "$iso" > "release/$iso.sha256"
          parts="$(cd release && ls *.part* | sort | tr '\n' ' ')"
          cat > release/join.sh <<EOF
          #!/bin/sh
          # Put the Veil OS ISO back together and check it.
          set -e
          cat $iso.part* > $iso
          sha256sum -c $iso.sha256
          EOF
          cat > release/join.cmd <<EOF
          @echo off
          rem Put the Veil OS ISO back together and check it.
          copy /b $(echo "$parts" | sed 's/ *$//; s/ /"+"/g; s/^/"/; s/$/"/') "$iso"
          certutil -hashfile "$iso" SHA256
          type "$iso.sha256"
          EOF
          chmod +x release/join.sh
          ls -la release

      # The release is made first and its files uploaded one at a time: a
      # single upload of gigabytes is the thing most likely to fail, and a
      # retry then costs one file rather than all of them.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/os-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="$GITHUB_REF_NAME"
          {
            gh release view "$tag" > /dev/null 2>&1 \
              || gh release create "$tag" --draft --title "Veil OS ${tag#os-v}" \
                   --notes-file out/boot-test/summary.md
            for f in out/release/*; do
              for try in 1 2 3; do
                echo "uploading $(basename "$f") ($(du -h "$f" | cut -f1)), try $try"
                if gh release upload "$tag" "$f" --clobber; then break; fi
                [ "$try" = 3 ] && { echo "giving up on $f"; exit 1; }
                sleep 30
              done
            done
            gh release view "$tag" --json isDraft,assets
          } 2>&1 | tee release.log

      # A job's log can only be read by someone signed in with access to the
      # repository; annotations can be read by anyone. The end of each log,
      # as annotations, is what a failed build is diagnosed from.
      - name: Where it stopped
        if: failure()
        shell: bash
        run: |
          for f in build.log boot-tools.log boot-test.log release.log out/boot-test/uefi/serial.log; do
            [ -f "$f" ] || continue
            sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r//g' "$f" | tail -n 60 | cut -c1-160 \
              | python3 -c '
          import sys
          lines = sys.stdin.read().splitlines()
          for i in range(0, len(lines), 30):
              text = "\n".join(lines[i:i + 30]).replace("%", "%25").replace("\n", "%0A")
              print(f"::error title={sys.argv[1]} ({i // 30 + 1} of 2)::{text}")
          ' "$f"
          done

      # The same logs and the screenshots, on a branch anyone can read.
      - name: Publish logs and screenshots
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          dir="$(mktemp -d)"
          mkdir -p "$dir/run"
          echo "run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} commit ${GITHUB_SHA}" > "$dir/run/RUN"
          if [ -f build.log ]; then
            sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r//g' build.log | tail -n 6000 > "$dir/run/build.log"
            grep -n -i -E 'error|fail|unable|not found|cannot|!!' "$dir/run/build.log" | tail -n 300 > "$dir/run/build-errors.txt" || true
          fi
          for f in boot-tools.log boot-test.log release.log; do
            if [ -f "$f" ]; then sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' "$f" > "$dir/run/$f"; fi
          done
          if [ -d out/boot-test ]; then
            (cd out && find boot-test \( -name '*.png' -o -name '*.log' -o -name '*.md' \) -print0 \
              | xargs -0 -r cp --parents -t "$dir/run")
          fi
          cd "$dir"
          git init -q -b ci-logs
          git add -A
          git -c user.name="Veil CI" -c user.email="ci@users.noreply.github.com" commit -qm "Logs for run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: |
            out/boot-test/**/*.png
            out/boot-test/**/*.log
            out/boot-test/summary.md
          if-no-files-found: warn
          retention-days: 30

